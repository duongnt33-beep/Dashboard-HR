<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR System — Nhân Sự</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#F97316;--orange2:#EA580C;--orange-light:#FFF7ED;
  --dark1:#111827;--dark2:#1F2937;--dark3:#374151;
  --gray:#6B7280;--gray2:#9CA3AF;--gray3:#D1D5DB;--gray4:#F3F4F6;
  --white:#fff;--red:#EF4444;--green:#10B981;--blue:#3B82F6;
  --sidebar-w:240px;
}
body{font-family:'Segoe UI',sans-serif;background:var(--gray4);color:var(--dark1);font-size:14px}

/* ===LOGIN=== */
#loginPage{display:flex;align-items:center;justify-content:center;min-height:100vh;
  background:linear-gradient(135deg,var(--dark1),var(--dark2),#2d1a0e)}
.login-box{background:var(--white);border-radius:16px;padding:40px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo .icon{width:60px;height:60px;background:linear-gradient(135deg,var(--orange),var(--orange2));
  border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:12px}
.login-logo h2{font-size:22px;font-weight:700;color:var(--dark1)}
.login-logo p{color:var(--gray);font-size:13px;margin-top:4px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--dark2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-group input{width:100%;border:2px solid var(--gray3);border-radius:8px;padding:10px 14px;font-size:14px;transition:.2s}
.form-group input:focus{outline:none;border-color:var(--orange)}
.btn-login{width:100%;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;border:none;
  border-radius:8px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;transition:.2s}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 4px 15px rgba(249,115,22,.4)}
.login-err{color:var(--red);font-size:13px;text-align:center;margin-top:10px;min-height:20px}

/* ===LAYOUT=== */
#app{display:none}
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;
  background:linear-gradient(180deg,var(--dark1) 0%,var(--dark2) 60%,#2d1a0e 100%);
  display:flex;flex-direction:column;z-index:100;overflow:hidden}
.sidebar-logo{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-logo .brand{display:flex;align-items:center;gap:10px}
.sidebar-logo .brand-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--orange),var(--orange2));
  border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sidebar-logo .brand-text{color:#fff;font-weight:700;font-size:15px;line-height:1.2}
.sidebar-logo .brand-sub{color:rgba(255,255,255,.5);font-size:11px}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 0}
.nav-section{padding:8px 16px 4px;color:rgba(255,255,255,.35);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;color:rgba(255,255,255,.7);
  cursor:pointer;border-radius:0;transition:.15s;border-left:3px solid transparent;margin:1px 0;font-size:13px}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(249,115,22,.15);color:var(--orange);border-left-color:var(--orange);font-weight:600}
.nav-item .ni{width:18px;text-align:center;font-size:15px}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;
  padding:1px 7px;font-size:10px;font-weight:700}
.sidebar-user{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08)}
.user-info{display:flex;align-items:center;gap:10px}
.user-avatar{width:34px;height:34px;background:linear-gradient(135deg,var(--orange),var(--orange2));
  border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex-shrink:0}
.user-name{color:#fff;font-size:13px;font-weight:600;line-height:1.3}
.user-role{color:rgba(255,255,255,.5);font-size:11px}
.btn-logout{margin-left:auto;background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.6);
  border-radius:6px;padding:5px 8px;cursor:pointer;font-size:12px;transition:.15s}
.btn-logout:hover{background:rgba(239,68,68,.3);color:#fff}

.main{margin-left:var(--sidebar-w);min-height:100vh}
.topbar{background:var(--white);border-bottom:1px solid var(--gray3);padding:14px 24px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.topbar h1{font-size:18px;font-weight:700;color:var(--dark1);flex:1}
.topbar .tb-right{display:flex;align-items:center;gap:10px}
.content{padding:24px}

/* ===CARDS=== */
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:24px}
@media(max-width:1400px){.kpi-grid{grid-template-columns:repeat(3,1fr)}}
.kpi-card{background:var(--white);border-radius:12px;padding:16px;position:relative;overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid var(--gray3)}
.kpi-card .kpi-label{font-size:11px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.kpi-card .kpi-val{font-size:28px;font-weight:800;color:var(--dark1);line-height:1}
.kpi-card .kpi-sub{font-size:12px;color:var(--gray);margin-top:5px}
.kpi-card .kpi-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);
  font-size:32px;opacity:.12}
.kpi-card.orange{border-left:4px solid var(--orange)}
.kpi-card.green{border-left:4px solid var(--green)}
.kpi-card.red{border-left:4px solid var(--red)}
.kpi-card.blue{border-left:4px solid var(--blue)}

/* ===FILTER BAR=== */
.filter-bar{background:var(--white);border-radius:12px;padding:14px 18px;margin-bottom:20px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid var(--gray3)}
.filter-bar label{font-size:12px;font-weight:600;color:var(--gray);white-space:nowrap}
.filter-bar select,.filter-bar input[type=text]{border:1px solid var(--gray3);border-radius:7px;padding:7px 10px;font-size:13px;color:var(--dark1);background:#fff;cursor:pointer}
.filter-bar select:focus,.filter-bar input[type=text]:focus{outline:none;border-color:var(--orange)}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:7px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:var(--orange2)}
.btn-success{background:var(--green);color:#fff}.btn-success:hover{background:#059669}
.btn-secondary{background:var(--gray4);color:var(--dark2);border:1px solid var(--gray3)}.btn-secondary:hover{background:var(--gray3)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:#DC2626}
.btn-sm{padding:5px 10px;font-size:12px}

/* ===CHARTS=== */
.charts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:20px}
.charts-grid.three{grid-template-columns:repeat(3,1fr)}
.chart-card{background:var(--white);border-radius:12px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid var(--gray3)}
.chart-card h3{font-size:13px;font-weight:700;color:var(--dark2);margin-bottom:14px;text-transform:uppercase;letter-spacing:.5px}
.chart-card .chart-wrap{position:relative;height:200px}
.chart-full{grid-column:1/-1}

/* ===TABLE=== */
.table-card{background:var(--white);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid var(--gray3);margin-bottom:20px;overflow:hidden}
.table-card-head{padding:14px 18px;border-bottom:1px solid var(--gray3);display:flex;align-items:center;gap:10px}
.table-card-head h3{font-size:14px;font-weight:700;color:var(--dark1);flex:1}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{background:var(--gray4);padding:10px 12px;text-align:left;font-size:11px;font-weight:700;
  color:var(--gray);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;border-bottom:1px solid var(--gray3)}
tbody td{padding:9px 12px;border-bottom:1px solid var(--gray4);font-size:13px;white-space:nowrap}
tbody tr:hover{background:var(--orange-light)}
tbody tr:last-child td{border-bottom:none}
.empty-row td{text-align:center;color:var(--gray2);padding:24px}

/* ===TABS=== */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--gray3);margin-bottom:20px}
.tab{padding:10px 18px;cursor:pointer;font-size:13px;font-weight:600;color:var(--gray);
  border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s}
.tab.active{color:var(--orange);border-bottom-color:var(--orange)}
.tab-content{display:none}.tab-content.active{display:block}

/* ===BADGES=== */
.badge-status{display:inline-block;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600}
.bs-active{background:#D1FAE5;color:#065F46}
.bs-resign{background:#FEE2E2;color:#991B1B}
.bs-trial{background:#FEF3C7;color:#92400E}
.bs-mat{background:#E0F2FE;color:#075985}
.bs-other{background:var(--gray3);color:var(--dark3)}

/* ===MODAL=== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 10px}
.modal-overlay.open{display:flex}
.modal{background:var(--white);border-radius:14px;width:100%;max-width:860px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--gray3);display:flex;align-items:center}
.modal-head h2{font-size:16px;font-weight:700;flex:1}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--gray);line-height:1;padding:0 4px}
.modal-close:hover{color:var(--dark1)}
.modal-body{padding:22px;max-height:72vh;overflow-y:auto}
.modal-foot{padding:14px 22px;border-top:1px solid var(--gray3);display:flex;justify-content:flex-end;gap:10px}

/* ===FORM=== */
.form-section{margin-bottom:22px}
.form-section-title{font-size:12px;font-weight:700;color:var(--orange);text-transform:uppercase;
  letter-spacing:.8px;padding-bottom:8px;border-bottom:2px solid var(--orange-light);margin-bottom:14px}
.form-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:10px}
.form-row.col2{grid-template-columns:repeat(2,1fr)}
.form-row.col4{grid-template-columns:repeat(4,1fr)}
.form-row.col1{grid-template-columns:1fr}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:11px;font-weight:600;color:var(--dark3);text-transform:uppercase;letter-spacing:.4px}
.fg input,.fg select,.fg textarea{border:1px solid var(--gray3);border-radius:7px;padding:8px 10px;font-size:13px;
  color:var(--dark1);background:#fff;transition:.15s;width:100%}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(249,115,22,.1)}
.fg input[readonly]{background:var(--gray4);color:var(--gray)}
.fg textarea{resize:vertical;min-height:60px}

/* ===SEARCH=== */
.search-input{border:1px solid var(--gray3);border-radius:8px;padding:9px 14px;font-size:13px;width:220px}
.search-input:focus{outline:none;border-color:var(--orange)}

/* ===TOAST=== */
#toastBox{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--dark1);color:#fff;border-radius:10px;padding:12px 18px;font-size:13px;
  box-shadow:0 4px 16px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px;min-width:240px;
  animation:slideIn .25s ease;border-left:4px solid var(--orange)}
.toast.success{border-left-color:var(--green)}
.toast.error{border-left-color:var(--red)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ===SPINNER=== */
.spin{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===PAGINATION=== */
.pager{display:flex;align-items:center;gap:6px;padding:12px 18px;border-top:1px solid var(--gray3)}
.page-btn{border:1px solid var(--gray3);background:#fff;border-radius:6px;padding:5px 10px;
  font-size:12px;cursor:pointer;color:var(--dark2)}
.page-btn:hover,.page-btn.active{background:var(--orange);color:#fff;border-color:var(--orange)}
.page-info{font-size:12px;color:var(--gray);margin-left:8px}

/* ===LOADING=== */
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.8);z-index:300;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.loading-spinner{width:48px;height:48px;border:4px solid var(--gray3);border-top-color:var(--orange);
  border-radius:50%;animation:spin .7s linear infinite}
.loading-text{color:var(--gray);font-size:14px;font-weight:500}

/* ===ADMIN PANEL=== */
.admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.user-card{background:var(--white);border-radius:10px;padding:16px;border:1px solid var(--gray3);
  display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.user-card .ua{width:40px;height:40px;background:linear-gradient(135deg,var(--orange),var(--orange2));
  border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0}
.user-card .uinfo{flex:1}
.user-card .uname{font-weight:700;font-size:14px}
.user-card .urole{font-size:12px;color:var(--gray);margin-top:2px}
.user-card .ubadge{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:2px 7px;margin-top:4px}
.role-tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;
  background:rgba(249,115,22,.12);color:var(--orange)}
.perm-matrix{width:100%;border-collapse:collapse;font-size:12px}
.perm-matrix th{background:var(--gray4);padding:8px 10px;font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;border:1px solid var(--gray3);text-align:center}
.perm-matrix td{padding:7px 10px;border:1px solid var(--gray4);text-align:center;vertical-align:middle}
.perm-matrix td:first-child{text-align:left;font-weight:600;color:var(--dark2);background:var(--gray4)}
.perm-cell{width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;font-size:15px;border:2px solid transparent}
.perm-cell.on{background:#D1FAE5;border-color:#10B981;color:#065F46}
.perm-cell.off{background:var(--gray4);border-color:var(--gray3);color:var(--gray2)}
.perm-cell.on-blue{background:#DBEAFE;color:var(--blue);border-color:var(--blue)}
.perm-cell:hover{transform:scale(1.15)}

/* ===DATE PICKER=== */
.date-range-wrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.date-range-wrap label{font-size:12px;font-weight:600;color:var(--gray);white-space:nowrap}
.date-range-wrap input[type=date]{border:1px solid var(--gray3);border-radius:7px;padding:6px 9px;font-size:13px;color:var(--dark1);background:#fff;cursor:pointer}
.date-range-wrap input[type=date]:focus{outline:none;border-color:var(--orange)}
.date-range-sep{color:var(--gray2);font-size:13px}

/* ===COMBOBOX SEARCH=== */
.combo-wrap{position:relative;display:inline-block}
.combo-input{border:1px solid var(--gray3);border-radius:7px;padding:7px 10px 7px 32px;font-size:13px;color:var(--dark1);background:#fff;width:180px;transition:.15s}
.combo-input:focus{outline:none;border-color:var(--orange);width:220px}
.combo-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;color:var(--gray)}
.combo-dropdown{position:absolute;top:calc(100% + 4px);left:0;min-width:100%;background:#fff;border:1px solid var(--gray3);border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.12);z-index:500;max-height:220px;overflow-y:auto;display:none}
.combo-dropdown.open{display:block}
.combo-option{padding:8px 12px;font-size:13px;cursor:pointer;transition:.1s;white-space:nowrap}
.combo-option:hover,.combo-option.highlighted{background:var(--orange-light);color:var(--orange)}
.combo-option .combo-match{font-weight:700;color:var(--orange2)}
.text-orange{color:var(--orange2);font-weight:600}

/* ===COMPANY MGMT=== */
.company-tag{display:inline-flex;align-items:center;gap:5px;background:var(--orange-light);border:1px solid rgba(249,115,22,.3);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--dark2);margin:3px}
.company-tag .ctag-del{background:none;border:none;cursor:pointer;color:var(--gray);font-size:14px;line-height:1;padding:0 2px}
.company-tag .ctag-del:hover{color:var(--red)}
.pass-eye{background:none;border:none;cursor:pointer;font-size:15px;padding:0 4px;color:var(--gray)}
.pass-eye:hover{color:var(--orange)}
</style>
</head>
<body>
<!-- LOGIN -->
<div id="loginPage">
  <div class="login-box">
    <div class="login-logo">
      <div class="icon">👥</div>
      <h2>HR System</h2>
      <p>Hệ thống Quản lý Nhân sự</p>
    </div>
    <div class="form-group">
      <label>Tên đăng nhập</label>
      <input id="lgUser" type="text" placeholder="username" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Mật khẩu</label>
      <input id="lgPass" type="password" placeholder="••••••" autocomplete="current-password">
    </div>
    <button class="btn-login" onclick="doLogin()">Đăng nhập</button>
    <div class="login-err" id="lgErr"></div>
  </div>
</div>
<!-- TOAST -->
<div id="toastBox"></div>
<!-- LOADING -->
<div class="loading-overlay" id="loadingOverlay" style="display:none">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">Đang tải...</div>
</div>
<script>

// Columns each role CAN EDIT
var ROLE_COL_MAP = {

// USER PERMISSIONS: phân quyền chi tiết theo tài khoản
// Mỗi entry: { username, areas: ['Hồ sơ nhân viên','Thôi việc',...], congTys: ['Công ty A',...] }
// [] = tất cả (không giới hạn)
var USER_PERMS = [];  // sẽ được tự động khởi tạo từ USERS

function initUserPerms() {
  // Load saved perms từ localStorage nếu có
  var savedPerms = lsLoad(LS_PERMS_KEY) || [];
  USER_PERMS = USERS.map(function(u) {
    // Ưu tiên data từ localStorage (admin đã lưu)
    var fromLS = savedPerms.find(function(p){ return p.username === u.username; });
    if (fromLS) return { username: u.username, areas: fromLS.areas||[], congTys: fromLS.congTys||[] };
    // Tìm entry đã có trong memory
    var existing = USER_PERMS.find(function(p){ return p.username === u.username; });
    if (existing) return existing;
    // Admin + truong: toàn quyền
    if (u.role === 'admin' || u.role === 'truong') {
      return { username: u.username, areas: [], congTys: [] }; // [] = all
    }
    // Map role sang work areas mặc định
    var areaMap = {
      hr_hoso: ['Hồ sơ nhân viên'],
      hr_hd:   ['Hợp đồng'],
      hr_nghi: ['Thôi việc'],
      cb_luong:['Lương'],
      cb_bh:   ['Bảo hiểm'],
      cb_thue: ['Thuế TNCN'],
    };
    // Ưu tiên mangCV đã được lưu vào user object
    var areas = (u.mangCV && u.mangCV.length) ? u.mangCV : (areaMap[u.role] || []);
    return {
      username: u.username,
      areas: areas,
      congTys: u.congTys || []
    };
  });
}

// Lấy danh sách modules mà user được phép truy cập (dựa USER_PERMS)
function getUserAllowedModules(username) {
  var u = USERS.find(function(x){ return x.username===username; });
  if (!u) return [];
  if (u.role === 'admin') return Object.keys(MODULES);
  var perm = USER_PERMS.find(function(p){ return p.username===username; });
  if (!perm) return ['dashboard'];
  var allowed = ['dashboard'];
  if (u.role === 'truong') return Object.keys(MODULES);
  // Collect modules from work areas
  (perm.areas||[]).forEach(function(area){
    var wa = WORK_AREAS[area];
    if (wa) wa.modules.forEach(function(m){ if (allowed.indexOf(m)<0) allowed.push(m); });
  });
  allowed.push('import');
  return allowed;
}

// Kiểm tra user có được xem/sửa data của công ty này không
function canAccessCongTy(username, congTy) {
  if (!congTy) return true;
  var perm = USER_PERMS.find(function(p){ return p.username===username; });
  if (!perm || !perm.congTys || !perm.congTys.length) return true; // [] = all
  return perm.congTys.indexOf(congTy) >= 0;
}

// Lấy columns user được edit dựa theo areas được phân
function getUserEditCols(username) {
  var u = USERS.find(function(x){ return x.username===username; });
  if (!u) return [];
  if (u.role === 'admin') return null; // all
  if (u.role === 'truong') return null; // view all
  var perm = USER_PERMS.find(function(p){ return p.username===username; });
  if (!perm || !perm.areas || !perm.areas.length) return [];
  var cols = [];
  perm.areas.forEach(function(area){
    var wa = WORK_AREAS[area];
    if (wa && wa.cols) wa.cols.forEach(function(c){ if (cols.indexOf(c)<0) cols.push(c); });
  });
  return cols;
}

function calcAge(dob) {
  if (!dob) return '';
  var parts = dob.split('/');
  if (parts.length !== 3) return '';
  var birth = new Date(+parts[2], +parts[1]-1, +parts[0]);
  return Math.floor((new Date()-birth)/31557600000);
}
function diffMonths(s) {
  if (!s) return 0;
  var parts = s.split('/');
  if (parts.length !== 3) return 0;
  var d = new Date(+parts[2], +parts[1]-1, +parts[0]);
  var now = new Date();
  return (now.getFullYear()-d.getFullYear())*12 + now.getMonth()-d.getMonth();
}

function doLogin() {
  var u = document.getElementById('lgUser').value.trim();
  var p = document.getElementById('lgPass').value;
  var errEl = document.getElementById('lgErr');
  if (!u || !p) { errEl.textContent = 'Vui lòng nhập tên đăng nhập và mật khẩu'; return; }
  errEl.textContent = 'Đang đăng nhập...';
  var btn = document.querySelector('.btn-login');
  if (btn) btn.disabled = true;

  fetch(GAS_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'login', username: u, password: p })
  })
  .then(function(r){ return r.json(); })
  .then(function(res) {
    if (btn) btn.disabled = false;
    if (!res.ok) { errEl.textContent = res.msg || 'Sai tên đăng nhập hoặc mật khẩu'; return; }
    var found = res.user;
    // Merge vào USERS local để các hàm khác dùng được
    var existing = USERS.find(function(x){ return x.username===found.username; });
    if (!existing) USERS.push(found);
    else Object.assign(existing, found);
    CU = USERS.find(function(x){ return x.username===found.username; }) || found;
    // Khởi tạo USER_PERMS từ data GAS trả về
    var existPerm = USER_PERMS.find(function(p){ return p.username===found.username; });
    if (!existPerm) USER_PERMS.push({ username: found.username, areas: found.areas||[], congTys: found.congTys||[] });
    initUserPerms();
    errEl.textContent = '';
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('uAvatar').textContent = found.hoTen[0];
    document.getElementById('uName').textContent = found.hoTen;
    document.getElementById('uRole').textContent = ROLE_LABELS[found.role] || found.role;
    if (found.role === 'admin' || found.role === 'truong') {
      // Load tất cả users từ GAS
      fetch(GAS_URL + '?action=getUsers')
        .then(function(r){ return r.json(); })
        .then(function(users) {
          if (Array.isArray(users)) {
            localUsers.length = 0;
            USERS.length = 0;
            users.forEach(function(x){ localUsers.push(x); USERS.push(x); });
          }
          buildSidebar();
          loadData();
        }).catch(function(){ buildSidebar(); loadData(); });
    } else {
      buildSidebarDataEntry();
      renderDataEntry();
    }
  })
  .catch(function(err) {
    if (btn) btn.disabled = false;
    // Fallback: thử đăng nhập offline với USERS mặc định
    var found = USERS.find(function(x){ return x.username===u && x.password===p; });
    if (!found) { errEl.textContent = 'Không kết nối được server. Vui lòng thử lại.'; return; }
    CU = found;
    initUserPerms();
    errEl.textContent = '';
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('uAvatar').textContent = found.hoTen[0];
    document.getElementById('uName').textContent = found.hoTen;
    document.getElementById('uRole').textContent = ROLE_LABELS[found.role] || found.role;
    if (found.role === 'admin' || found.role === 'truong') { buildSidebar(); loadData(); }
    else { buildSidebarDataEntry(); renderDataEntry(); }
  });
}
function doLogout() {
  CU = null; DATA = []; FDATA = [];
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('lgUser').value = '';

      showToast('Không kết nối được GAS. Vui lòng thử lại.','error');
      DATA = [];
      applyFilters();
      navTo(curModule);
    });
}
function applyFilters() {
  FDATA = DATA.filter(function(r) {
    // Lọc theo khối user phụ trách
    if (CU.khois && CU.khois.length && CU.khois.indexOf(r.khoi) < 0) return false;
    // Lọc theo công ty user được phân quyền
    if (CU.role !== 'admin' && !canAccessCongTy(CU.username, r.congTy)) return false;
    // Dashboard filters
    if (filterKhoi && r.khoi !== filterKhoi) return false;
    if (filterStatus && r.trangThai !== filterStatus) return false;
    if (filterCompany && r.congTy !== filterCompany) return false;
    if (filterPhong && r.phongBan !== filterPhong) return false;
    return true;
  });
}
function isResigned(r) { var s=r.trangThai||''; return s==='Nghỉ việc'||s==='Đã thôi việc'||s==='Đã nghỉ việc'||s==='Thôi việc'; }
function getActive() { return DATA.filter(function(r){ return !isResigned(r); }); }
function getResigned() { return DATA.filter(function(r){ return isResigned(r); }); }
function getExpire() {
  var today = new Date();
  return DATA.filter(function(r){
    var d = r.ngayHetHanHDTV||r.ngayHetHanHDLD_L1||'';
    if (!d) return false;
    var p = d.split('/');
    if (p.length!==3) return false;
    var dt = new Date(+p[2],+p[1]-1,+p[0]);
    var diff = (dt-today)/86400000;
    return diff>=0 && diff<=60;
  });
}
function getKhois() {
  var set = {};
  DATA.forEach(function(r){ if (r.khoi) set[r.khoi]=1; });
  return Object.keys(set).sort();
}

function getCongTys() {

function buildCombo(id, placeholder, items, value, onSelect) {
  var uid = id;
  return '<div class="combo-wrap" id="cwrap_'+uid+'">'+
    '<span class="combo-icon">🔍</span>'+
    '<input class="combo-input" id="cinput_'+uid+'" placeholder="'+placeholder+'" value="'+esc(value)+'" '+
      'oninput="filterCombo(\''+uid+'\')" onfocus="openCombo(\''+uid+'\')" onblur="setTimeout(function(){closeCombo(\''+uid+'\')},200)" autocomplete="off">'+
    '<div class="combo-dropdown" id="cdrop_'+uid+'">'+
      buildComboOptions(uid, items, value, onSelect)+
    '</div>'+
  '</div>';
}
function buildComboOptions(uid, items, value, onSelect) {
  var q = (document.getElementById('cinput_'+uid) ? document.getElementById('cinput_'+uid).value : value) || '';
  var filtered = q ? items.filter(function(x){ return x.toLowerCase().indexOf(q.toLowerCase())>=0; }) : items;
  if (!filtered.length) return '<div class="combo-option" style="color:var(--gray2);cursor:default">Không tìm thấy</div>';
  var allOpt = q ? '' : '<div class="combo-option" onclick="selectCombo(\''+uid+'\',\'\',\''+onSelect+'\')">— Tất cả —</div>';
  return allOpt + filtered.map(function(x){
    var display = q ? x.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<span class="combo-match">$1</span>') : x;
    return '<div class="combo-option" onclick="selectCombo(\''+uid+'\',\''+x.replace(/'/g,'\\\'')+ '\',\''+onSelect+'\')">'+display+'</div>';
  }).join('');
}
function openCombo(uid) {
  var drop = document.getElementById('cdrop_'+uid);
  if (drop) drop.classList.add('open');
}
function closeCombo(uid) {
  var drop = document.getElementById('cdrop_'+uid);
  if (drop) drop.classList.remove('open');
}
function filterCombo(uid) {
  var input = document.getElementById('cinput_'+uid);
  var drop = document.getElementById('cdrop_'+uid);
  if (!input || !drop) return;
  var q = input.value;
  var items = window['_comboItems_'+uid] || [];
  var onSelect = window['_comboOnSelect_'+uid] || '';
  // rebuild options
  var filtered = q ? items.filter(function(x){ return x.toLowerCase().indexOf(q.toLowerCase())>=0; }) : items;
  var allOpt = q ? '' : '<div class="combo-option" onclick="selectCombo(\''+uid+'\',\'\',\''+onSelect+'\')">— Tất cả —</div>';
  drop.innerHTML = allOpt + (filtered.length ? filtered.map(function(x){
    var display = x.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<span class="combo-match">$1</span>');
    return '<div class="combo-option" onclick="selectCombo(\''+uid+'\',\''+x.replace(/'/g,'\\\'')+ '\',\''+onSelect+'\')">'+display+'</div>';
  }).join('') : '<div class="combo-option" style="color:var(--gray2);cursor:default">Không tìm thấy</div>');
  drop.classList.add('open');
}
function selectCombo(uid, val, onSelect) {
  var input = document.getElementById('cinput_'+uid);
  if (input) input.value = val;
  closeCombo(uid);
  if (onSelect) { try { eval(onSelect+'(\''+val.replace(/'/g,'\\\'') +'\')'); } catch(e){} }
}
function initComboData(uid, items, onSelect) {
  window['_comboItems_'+uid] = items;
  window['_comboOnSelect_'+uid] = onSelect;
}

function getFDataActive() { return FDATA.filter(function(r){ return !isResigned(r); }); }
function getFDataResigned() { return FDATA.filter(function(r){ return isResigned(r); }); }
function getFDataExpire() {
  var today = new Date();
  return FDATA.filter(function(r){
    var d = r.ngayHetHanHDTV||r.ngayHetHanHDLD_L1||'';
    if (!d) return false;
    var p = d.split('/');
    if (p.length!==3) return false;
    var dt = new Date(+p[2],+p[1]-1,+p[0]);
    var diff = (dt-today)/86400000;
    return diff>=0 && diff<=60;
  });
}

function updateDashData() {
  applyFilters();
  var active = getFDataActive();
  var resigned = getFDataResigned();
  var expire = getFDataExpire();
  var total = FDATA.length;
  var tyLeNghi = total > 0 ? ((resigned.length/total)*100).toFixed(1) : 0;
  var tongLuong = active.reduce(function(s,r){ return s+(parseFloat(r.tongThuNhap)||0); }, 0);
  var sysTotal = DATA.length;
  var sysActive = getActive().length;
  var sysResigned = getResigned().length;
  var sysTongLuong = DATA.reduce(function(s,r){return s+(parseFloat(r.tongThuNhap)||0);},0);
  var pctOfSys     = sysTotal>0 ? ((total/sysTotal)*100).toFixed(1) : '100';
  var activeSysPct = sysTotal>0 ? ((active.length/sysTotal)*100).toFixed(1) : '0';
  var resignedSysPct = sysTotal>0 ? ((resigned.length/sysTotal)*100).toFixed(1) : '0';
  var expireSysPct = sysTotal>0 ? ((expire.length/sysTotal)*100).toFixed(1) : '0';

  // Cập nhật KPI cards
  var kpiEl = document.getElementById('dashKpiGrid');
  if (kpiEl) kpiEl.innerHTML =
    kpiCard('Tổng NV','orange',total+' / '+sysTotal,'👥',pctOfSys+'% toàn HT')+
    kpiCard('Đang làm việc','green',active.length,'✅',activeSysPct+'% toàn HT')+
    kpiCard('Đã thôi việc','red',resigned.length,'🚪',resignedSysPct+'% toàn HT')+
    kpiCard('Tỷ lệ nghỉ','red',tyLeNghi+'%','📉','trong nhóm lọc')+
    kpiCard('HĐ hết hạn','blue',expire.length,'⏰',expireSysPct+'% toàn HT')+
    kpiCard('Quỹ lương','orange',fmtNum(Math.round(tongLuong/1000000))+'tr','💰','HT: '+fmtNum(Math.round(sysTongLuong/1000000))+'tr');

  // Sync trạng thái select
  var sel = document.getElementById('dashStatusSel');
  if (sel) sel.value = filterStatus || '';

  // Re-render tất cả charts
  setTimeout(function() {
    renderChartTrend();
    renderChartYearlyResign();
    renderChartKhoi();
    renderChartCongTy();
    renderChartGender();
    renderChartAge();
    renderChartTenure();
    renderChartContract();
    renderChartEdu();
    renderChartResignKhoi();
    renderChartSalaryKhoi();
    renderDashTab(0);
  }, 0);
}

function renderDashTab(idx) {
  var cont = document.getElementById('dashTabContent');
  if (!cont) return;
  var khois = getKhois();
  if (idx === 0) {
    // Theo khối
    var rows = khois.map(function(k) {
      var kdata = DATA.filter(function(r){ return r.khoi===k; });
      var act = kdata.filter(function(r){ return r.trangThai==='Đang làm việc'||r.trangThai==='Thử việc'; });
      var nghi = kdata.filter(function(r){ return r.trangThai==='Nghỉ việc'||r.trangThai==='Đã thôi việc'; });
      var luong = act.reduce(function(s,r){ return s+(parseFloat(r.tongThuNhap)||0); },0);
      return '<tr><td><b>'+esc(k)+'</b></td><td>'+kdata.length+'</td><td>'+act.length+'</td><td>'+nghi.length+'</td>'+
        '<td>'+(kdata.length?((nghi.length/kdata.length*100).toFixed(1))+'%':'—')+'</td>'+
        '<td>'+fmtNum(Math.round(luong/1000000))+'tr</td></tr>';
    });
    cont.innerHTML = '<div class="table-wrap"><table><thead><tr><th>Khối</th><th>Tổng NV</th><th>Đang làm</th><th>Đã nghỉ</th><th>Tỷ lệ nghỉ</th><th>Quỹ lương</th></tr></thead><tbody>'+
      (rows.length ? rows.join('') : '<tr class="empty-row"><td colspan="6">Không có dữ liệu</td></tr>') + '</tbody></table></div>';
  } else if (idx === 1) {
    // Top nghỉ việc
    var resigned = getResigned().slice(0,20);
    cont.innerHTML = '<div class="table-wrap"><table><thead><tr><th>Mã NV</th><th>Họ tên</th><th>Khối</th><th>Phòng ban</th><th>Ngày thôi việc</th><th>Lý do</th></tr></thead><tbody>'+
      (resigned.length ? resigned.map(function(r){
        return '<tr><td>'+esc(r.maNV)+'</td><td>'+esc(r.hoTen)+'</td><td>'+esc(r.khoi)+'</td><td>'+esc(r.phongBan)+'</td>'+
          '<td>'+esc(r.ngayThoiViecThucTe)+'</td><td>'+esc(r.lyDoThoiViec)+'</td></tr>';
      }).join('') : '<tr class="empty-row"><td colspan="6">Không có dữ liệu</td></tr>') + '</tbody></table></div>';
  } else if (idx === 3) {
    // Theo công ty
    var sysT = DATA.length;
    var congTys = getCongTys();
    var rows3 = congTys.map(function(ct) {

      var nghi3 = ctdata.filter(function(r){ return r.trangThai==='Nghỉ việc'||r.trangThai==='Đã thôi việc'; });
      var pct3 = sysT > 0 ? ((ctdata.length/sysT*100).toFixed(1)) : '0.0';

      var bhxh = kdata.reduce(function(s,r){ return s+(parseFloat(r.bhxhNLD)||0); },0);
      var pctLuong = DATA.length > 0 ? ((kdata.length/DATA.length*100).toFixed(1)) : '0.0';
      return '<tr><td><b>'+esc(k)+'</b></td><td>'+kdata.length+'</td><td class="text-orange">'+pctLuong+'%</td><td>'+fmtNum(Math.round(cb/1000000))+'tr</td>'+
        '<td>'+fmtNum(Math.round(tong/1000000))+'tr</td><td>'+fmtNum(Math.round(bhxh/1000000))+'tr</td></tr>';
    });
    cont.innerHTML = '<div class="table-wrap"><table><thead><tr><th>Khối</th><th>Số NV</th><th>% Toàn HT</th><th>Lương CB</th><th>Tổng TN</th><th>BHXH NLĐ</th></tr></thead><tbody>'+
      (rows2.length ? rows2.join('') : '<tr class="empty-row"><td colspan="6">Không có dữ liệu</td></tr>') + '</tbody></table></div>';
  }
}

function renderNhanVien() {
  document.getElementById('topbarActions').innerHTML =

  document.getElementById('pageContent').innerHTML =

    '<div class="table-wrap" id="nvTableWrap"></div>'+
    '<div id="nvPager"></div>'+

function getNVRows() {
  var q = nvSearch.toLowerCase();
  var rows = FDATA.filter(function(r){
    return !q || (r.maNV+r.hoTen+r.phongBan+r.khoi).toLowerCase().indexOf(q)>=0;
  });
  if (CU.role === 'hr_hoso' || CU.role === 'hr_hd') {
    // only show nhan_vien columns — already filtered by khoi
  }
  return rows;
}
function renderNVTable() {
  var rows = getNVRows();
  var total = rows.length;
  var start = (nvPage-1)*PER_PAGE, end = Math.min(start+PER_PAGE, total);
  var page = rows.slice(start, end);
  document.getElementById('nvCount').textContent = total + ' nhân viên';
  var cols = [
    {key:'maNV',label:'Mã NV'},{key:'hoTen',label:'Họ tên'},{key:'chucDanh',label:'Chức danh'},
    {key:'phongBan',label:'Phòng ban'},{key:'khoi',label:'Khối'},{key:'ngayVaoGoc',label:'Ngày vào'},
    {key:'trangThai',label:'Trạng thái'},{key:'gioiTinh',label:'GT'},{key:'dienThoai',label:'Điện thoại'},
    {key:'loaiHD',label:'Loại HĐ'},
  ];
  var html = '<table><thead><tr>'+cols.map(function(c){ return '<th>'+c.label+'</th>'; }).join('')+'<th>Thao tác</th></tr></thead><tbody>';
  if (!page.length) { html += '<tr class="empty-row"><td colspan="'+(cols.length+1)+'">Không có dữ liệu</td></tr>'; }
  page.forEach(function(r) {
    html += '<tr>';
    cols.forEach(function(c) {
      if (c.key === 'trangThai') html += '<td>'+statusBadge(r[c.key])+'</td>';
      else html += '<td>'+esc(r[c.key]||'')+'</td>';
    });
    html += '<td>'+
      '<button class="btn btn-secondary btn-sm" onclick="viewNV(\''+esc(r.maNV)+'\')">👁</button> '+
      (!isReadOnly()?'<button class="btn btn-primary btn-sm" onclick="editNV(\''+esc(r.maNV)+'\')">✏️</button> ':'')+'</td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('nvTableWrap').innerHTML = html;
  renderPager('nvPager', nvPage, Math.ceil(total/PER_PAGE), function(p){ nvPage=p; renderNVTable(); });
}

function renderPager(elId, cur, total, cb) {
  if (total <= 1) { document.getElementById(elId).innerHTML = ''; return; }
  var html = '<div class="pager">';
  if (cur > 1) html += '<button class="page-btn" onclick="('+cb.toString()+')('+( cur-1)+')">←</button>';
  for (var i = Math.max(1,cur-2); i <= Math.min(total,cur+2); i++) {
    html += '<button class="page-btn'+(i===cur?' active':'')+'" onclick="('+cb.toString()+')('+i+')">'+i+'</button>';
  }
  if (cur < total) html += '<button class="page-btn" onclick="('+cb.toString()+')('+( cur+1)+')">→</button>';
  html += '<span class="page-info">Trang '+cur+'/'+total+'</span></div>';
  document.getElementById(elId).innerHTML = html;
}

    if (type === 'select') {

        (opts||[]).map(function(o){ return '<option value="'+esc(o)+'" '+(rec[key]===o?'selected':'')+'>'+esc(o)+'</option>'; }).join('')+
      '</select>';
    } else if (type === 'textarea') {
      inp = '<textarea name="'+key+'"'+(canE?'':' readonly')+'>'+val+'</textarea>';

function openAddNV() {
  editMaNV = null;
  document.getElementById('modalNVTitle').textContent = 'Thêm nhân viên mới';
  document.getElementById('modalNVBody').innerHTML = buildNVForm(null, false);
  openModal('modalNV');
}
function viewNV(maNV) {
  var rec = DATA.find(function(r){ return r.maNV===maNV; });
  if (!rec) return;
  editMaNV = maNV;
  document.getElementById('modalNVTitle').textContent = 'Chi tiết: '+rec.hoTen;
  document.getElementById('modalNVBody').innerHTML = buildNVForm(rec, true);
  document.getElementById('btnSaveNV').style.display = 'none';
  openModal('modalNV');
}
function editNV(maNV) {
  var rec = DATA.find(function(r){ return r.maNV===maNV; });
  if (!rec) return;
  editMaNV = maNV;
  document.getElementById('modalNVTitle').textContent = 'Sửa: '+rec.hoTen;
  document.getElementById('modalNVBody').innerHTML = buildNVForm(rec, false);
  document.getElementById('btnSaveNV').style.display = '';
  openModal('modalNV');
}
function saveNV() {
  var form = document.getElementById('fmNV');
  if (!form) return;
  var data = {};
  form.querySelectorAll('[name]').forEach(function(el) {
    if (!el.disabled && el.type !== 'submit') data[el.name] = el.value;
  });
  if (!data.maNV) { showToast('Vui lòng nhập Mã NV','error'); return; }
  if (!data.hoTen) { showToast('Vui lòng nhập Họ tên','error'); return; }
  data.nguoiNhap = CU.username;
  var action = editMaNV ? 'updateEmployee' : 'addEmployee';
  data.action = action;
  if (editMaNV) data.maNV = editMaNV;

  if (!GAS_URL || GAS_URL === 'YOUR_GAS_URL_HERE') {
    // Local mock
    if (editMaNV) {
      var idx = DATA.findIndex(function(r){ return r.maNV===editMaNV; });
      if (idx >= 0) Object.assign(DATA[idx], data);
    } else {
      DATA.push(data);
    }
    applyFilters();
    closeModal('modalNV');
    renderNhanVien();
    showToast('Đã lưu thành công','success');
    return;
  }
  showLoading('Đang lưu...');
  fetch(GAS_URL, {method:'POST',body:JSON.stringify(data)})
    .then(function(r){ return r.json(); })
    .then(function(d) {
      hideLoading();
      if (d.error) { showToast('Lỗi: '+d.error,'error'); return; }
      showToast('Đã lưu thành công','success');
      closeModal('modalNV');
      loadData();
    })
    .catch(function(e){ hideLoading(); showToast('Lỗi kết nối: '+e.message,'error'); });
}

  document.getElementById('pageContent').innerHTML =

    '<div style="font-size:40px;margin-bottom:12px">📂</div>'+

    '<input type="file" id="excelFile" accept=".xlsx,.xls" style="display:none" onchange="handleExcelFile(this)">'+
    '<button class="btn btn-primary" onclick="document.getElementById(\'excelFile\').click()">📁 Chọn file Excel</button>'+
    '&nbsp;<button class="btn btn-secondary" onclick="downloadTemplate()">⬇️ Tải mẫu Excel</button>'+
  '</div>'+
  '<div id="importPreview"></div>'+
  '</div>';

  // Setup drag & drop
  var zone = document.getElementById('dropZone');
  zone.addEventListener('dragover', function(e){ e.preventDefault(); zone.style.borderColor='#F97316'; });
  zone.addEventListener('dragleave', function(){ zone.style.borderColor='#D1D5DB'; });
  zone.addEventListener('drop', function(e){
    e.preventDefault(); zone.style.borderColor='#D1D5DB';
    var file = e.dataTransfer.files[0];
    if (file) handleExcelFileRaw(file);
  });
}

function handleExcelFile(input) {
  if (input.files && input.files[0]) handleExcelFileRaw(input.files[0]);
}
function handleExcelFileRaw(file) {
  showLoading('Đang đọc file Excel...');
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var wb = XLSX.read(e.target.result, {type:'array',cellDates:true});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var raw = XLSX.utils.sheet_to_json(ws, {header:1,raw:false,dateNF:'dd/mm/yyyy'});
      // Tìm dòng header (có Mã NV hoặc Họ và tên)
      var headerRow = -1;
      for (var i = 0; i < Math.min(raw.length, 5); i++) {
        var r = raw[i];
        if (r && r.some(function(c){ return c && (c.toString().indexOf('Mã NV')>=0||c.toString().indexOf('Họ')>=0); })) {
          headerRow = i; break;
        }
      }
      if (headerRow < 0) { hideLoading(); showToast('Không tìm thấy dòng tiêu đề trong file','error'); return; }
      var headers = raw[headerRow].map(function(h){ return (h||'').toString().trim().replace(/\s*\(\*\)\s*$/,''); });
      importRows = [];
      for (var j = headerRow+1; j < raw.length; j++) {
        var row = raw[j];
        if (!row || row.every(function(c){ return !c; })) continue;
        var obj = {};
        headers.forEach(function(h, i) {
          var v = row[i];
          obj[h] = v !== undefined && v !== null ? v.toString().trim() : '';
        });
        // Map Vietnamese headers to field keys
        var mapped = mapVietHeaders(obj);
        // Tự động tính Trạng thái nếu chưa có hoặc để trống
        if (!mapped.trangThai || mapped.trangThai === '') {
          if (mapped.ngayThoiViecThucTe && mapped.ngayThoiViecThucTe !== '') {
            mapped.trangThai = 'Đã nghỉ việc';
          } else {
            mapped.trangThai = 'Đang làm';
          }
        }
        if (mapped.maNV || mapped.hoTen) importRows.push(mapped);
      }
      hideLoading();
      renderImportPreview();
    } catch(err) {
      hideLoading();
      showToast('Lỗi đọc file: '+err.message,'error');
    }
  };
  reader.readAsArrayBuffer(file);
}

  Object.keys(obj).forEach(function(k) {

function doImport() {
  if (!importRows.length) { showToast('Không có dữ liệu để nhập','error'); return; }
  if (!GAS_URL || GAS_URL === 'YOUR_GAS_URL_HERE') {
    importRows.forEach(function(r) {
      r.nguoiNhap = CU.username;
      var existing = DATA.findIndex(function(x){ return x.maNV && x.maNV===r.maNV; });
      if (existing >= 0) Object.assign(DATA[existing], r);
      else DATA.push(r);
    });
    applyFilters();
    showToast('Đã nhập '+importRows.length+' dòng (chế độ offline)','success');
    importRows = [];
    document.getElementById('importPreview').innerHTML = '';
    return;
  }
  showLoading('Đang nhập '+importRows.length+' dòng...');
  var payload = {action:'batchImport', items: importRows.map(function(r){ r.nguoiNhap=CU.username; return r; })};
  fetch(GAS_URL, {method:'POST', body:JSON.stringify(payload)})
    .then(function(r){ return r.json(); })
    .then(function(d) {
      hideLoading();
      if (d.error) { showToast('Lỗi: '+d.error,'error'); return; }
      showToast('Đã nhập '+d.count+' dòng thành công','success');
      importRows = [];
      document.getElementById('importPreview').innerHTML = '';
      loadData();
    })
    .catch(function(e){ hideLoading(); showToast('Lỗi: '+e.message,'error'); });
}

async function downloadTemplate() {
  var headers = Object.keys(HEADER_MAP);
  var csv = '﻿' + headers.join(',') + '\n' +

  if (window.claude) {
    try {
      var downloads = await claude.use('downloads');
      if (downloads) {
        await downloads.save({filename: filename, data: new Blob([csv], {type:'text/csv;charset=utf-8'})});
        showToast('Đã tải mẫu '+filename,'success'); return;
      }
    } catch(e) {}
  }

async function exportModuleCSV(type) {
  var rows, filename;
  if (type==='nv') { rows=FDATA; filename='ho_so_nv'; }
  else if (type==='hd') { rows=DATA.filter(function(r){return r.loaiHD;}); filename='hop_dong'; }
  else if (type==='nghi') { rows=getResigned(); filename='thoi_viec'; }
  else if (type==='luong') { rows=getActive(); filename='luong'; }
  else if (type==='bh') { rows=getActive(); filename='bao_hiem'; }
  else if (type==='thue') { rows=getActive(); filename='thue_tncn'; }
  else rows = DATA;
  if (!rows.length) { showToast('Không có dữ liệu để xuất','error'); return; }
  var keys = Object.keys(rows[0]||{});
  var csv = '﻿' + keys.join(',') + '\n' +
    rows.map(function(r){ return keys.map(function(k){ var v=(r[k]||'').toString(); return v.indexOf(',')>=0?'"'+v+'"':v; }).join(','); }).join('\n');
  var fname = filename+'_'+new Date().toISOString().slice(0,10)+'.csv';
  if (window.claude) {
    try {
      var downloads = await claude.use('downloads');
      if (downloads) {
        await downloads.save({filename:fname, data:new Blob([csv],{type:'text/csv;charset=utf-8'})});
        showToast('Đã xuất '+fname,'success'); return;
      }
    } catch(e) {}
  }
  var a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download = fname; a.click();
  showToast('Đã xuất '+fname,'success');
}

function toggleUserAreaCell(username, area, el) {
  var perm = USER_PERMS.find(function(p){ return p.username===username; });
  if (!perm) { perm={username:username,areas:[],congTys:[]}; USER_PERMS.push(perm); }
  var isOn = el.classList.contains('on');
  if (isOn) {
    perm.areas = perm.areas.filter(function(a){ return a!==area; });
    el.classList.remove('on'); el.classList.add('off'); el.textContent='—';
  } else {
    if (perm.areas.indexOf(area)<0) perm.areas.push(area);
    el.classList.remove('off'); el.classList.add('on'); el.textContent='✓';
  }
}
function toggleUserCongTyCell(username, ct, el) {
  var perm = USER_PERMS.find(function(p){ return p.username===username; });
  if (!perm) { perm={username:username,areas:[],congTys:[]}; USER_PERMS.push(perm); }
  var isOn = el.classList.contains('on-blue');
  if (isOn) {
    perm.congTys = perm.congTys.filter(function(c){ return c!==ct; });
    el.classList.remove('on-blue'); el.classList.add('off'); el.textContent='—';
  } else {
    if (perm.congTys.indexOf(ct)<0) perm.congTys.push(ct);
    el.classList.remove('off'); el.classList.add('on-blue'); el.textContent='✓';
  }
}

function applyPermMatrix() {
  Object.keys(MODULES).forEach(function(mod){
    if (!PERM_MATRIX[mod]) return;
    MODULES[mod].roles = Object.keys(ROLE_LABELS).filter(function(r){ return PERM_MATRIX[mod][r]; });
  });
  buildSidebar();
  showToast('Đã áp dụng phân quyền mới','success');
}
function resetPermMatrix() {
  var defaults = {
    dashboard:['admin','truong','hr_hoso','hr_hd','hr_nghi','cb_luong','cb_bh','cb_thue'],
    nhanvien:['admin','truong','hr_hoso'],
    hopdong:['admin','truong','hr_hd','hr_hoso'],
    nghiviec:['admin','truong','hr_nghi','hr_hoso'],
    luong:['admin','truong','cb_luong'],
    baohiem:['admin','truong','cb_bh'],
    thue:['admin','truong','cb_thue'],
    import:['admin','hr_hoso','hr_hd','hr_nghi','cb_luong','cb_bh','cb_thue'],
    admin:['admin'],
  };
  Object.keys(MODULES).forEach(function(mod){
    PERM_MATRIX[mod] = {};
    Object.keys(ROLE_LABELS).forEach(function(role){
      PERM_MATRIX[mod][role] = (defaults[mod]||[]).indexOf(role) >= 0;
    });
    MODULES[mod].roles = defaults[mod] || [];
  });
  renderPermMatrix(document.getElementById('adminTabContent'));
  buildSidebar();
  showToast('Đã khôi phục phân quyền mặc định','success');
}

function editUser(idx) {
  editUserIdx = idx;
  document.getElementById('modalUserTitle').textContent = 'Sửa tài khoản';
  document.getElementById('modalUserBody').innerHTML = userForm(localUsers[idx]);
  openModal('modalUser');
}
function saveUser() {
  var body = document.getElementById('modalUserBody');
  var get = function(n){ var el=body.querySelector('[name="'+n+'"]'); return el?el.value:''; };
  var mangCV = Array.from(body.querySelectorAll('[name="mangCV"]:checked')).map(function(c){ return c.value; });
  var congTys = Array.from(body.querySelectorAll('[name="congty"]:checked')).map(function(c){ return c.value; });
  var role = get('role') || 'staff';
  var u = {
    hoTen:get('hoTen'), username:get('username'), password:get('password'),
    role: role, khois:[], congTys:congTys, mangCV:mangCV,
    sheet:get('sheet'), email:get('email'),
    isAdmin: role === 'admin'
  };
  if (!u.username||!u.password||!u.hoTen) { showToast('Vui lòng điền đầy đủ thông tin','error'); return; }

  var action = (editUserIdx !== null) ? 'updateUser' : 'addUser';
  showToast('Đang lưu...','info');
  fetch(GAS_URL, {
    method: 'POST',
    body: JSON.stringify({ action: action, data: u, username: u.username })
  })
  .then(function(r){ return r.json(); })
  .then(function(res) {
    if (!res.ok) { showToast(res.msg || 'Lỗi lưu tài khoản','error'); return; }
    // Cập nhật local
    if (editUserIdx !== null) localUsers[editUserIdx] = u;
    else localUsers.push(u);
    USERS.length = 0;
    localUsers.forEach(function(x){ USERS.push(x); });
    var existPerm = USER_PERMS.find(function(p){ return p.username===u.username; });
    if (existPerm) { existPerm.areas = mangCV; existPerm.congTys = congTys; }
    else USER_PERMS.push({ username: u.username, areas: mangCV, congTys: congTys });
    closeModal('modalUser');
    renderUserList();
    showToast('Đã lưu tài khoản','success');
  })
  .catch(function() {
    // Fallback: lưu local
    if (editUserIdx !== null) localUsers[editUserIdx] = u;
    else localUsers.push(u);
    USERS.length = 0;
    localUsers.forEach(function(x){ USERS.push(x); });
    lsSave(LS_USERS_KEY, localUsers);
    var existPerm = USER_PERMS.find(function(p){ return p.username===u.username; });
    if (existPerm) { existPerm.areas = mangCV; existPerm.congTys = congTys; }
    else USER_PERMS.push({ username: u.username, areas: mangCV, congTys: congTys });
    lsSave(LS_PERMS_KEY, USER_PERMS);
    closeModal('modalUser');
    renderUserList();
    showToast('Đã lưu (offline)','info');
  });
}
function deleteUser(idx) {
  var u = localUsers[idx];
  if (!u) return;
  if (document.getElementById('deleteConfirmBar')) document.getElementById('deleteConfirmBar').remove();
  var bar = document.createElement('div');
  bar.id = 'deleteConfirmBar';
  bar.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1F2937;color:#fff;padding:14px 20px;border-radius:12px;display:flex;align-items:center;gap:14px;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.3);font-size:14px';
  bar.innerHTML = '<span>Xóa tài khoản <b>'+esc(u.hoTen||u.username)+'</b>?</span>'+
    '<button onclick="confirmDeleteUser('+idx+')" style="background:#EF4444;color:#fff;border:none;padding:6px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600">Xóa</button>'+
    '<button onclick="document.getElementById(\'deleteConfirmBar\').remove()" style="background:#374151;color:#fff;border:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px">Hủy</button>';
  document.body.appendChild(bar);
  setTimeout(function(){ if(bar.parentNode) bar.remove(); }, 5000);
}
function confirmDeleteUser(idx) {
  if (document.getElementById('deleteConfirmBar')) document.getElementById('deleteConfirmBar').remove();
  var u = localUsers[idx];
  if (!u) return;
  fetch(GAS_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'deleteUser', username: u.username })
  })
  .then(function(r){ return r.json(); })
  .then(function(res) {
    if (!res.ok) { showToast(res.msg || 'Lỗi xóa tài khoản','error'); return; }
    localUsers.splice(idx,1);
    USERS.length = 0;
    localUsers.forEach(function(x){ USERS.push(x); });
    renderUserList();
    showToast('Đã xóa tài khoản','success');
  })
  .catch(function() {
    localUsers.splice(idx,1);
    USERS.length = 0;
    localUsers.forEach(function(x){ USERS.push(x); });
    lsSave(LS_USERS_KEY, localUsers);
    renderUserList();
    showToast('Đã xóa (offline)','info');
  });
}

function downloadTemplate() {
  var pc = document.getElementById('pageContent');
  var area = (pc && pc.dataset.curArea) ? pc.dataset.curArea : getMyAreas()[0];
  var myCongTys = getMyCongTys();
  var fname = 'Template_' + (area||'HR').replace(/[^a-zA-Z0-9]/g,'_') + '_' + new Date().toISOString().slice(0,10) + '.xlsx';

  // Load ExcelJS nếu chưa có (hỗ trợ style đầy đủ)
  if (typeof ExcelJS === 'undefined') {
    showToast('Đang tải thư viện, vui lòng đợi...', 'info');
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
    s.onload = function(){ downloadTemplate(); };
    document.head.appendChild(s);
    return;
  }

  // 1 template chung cho tất cả mảng — highlight tất cả cột của các mảng user được phân quyền
  var myAreas = getMyAreas();
  var allHeaders = ALL_94_COLS.concat(['Mức lương thỏa thuận','Mức tham gia BHXH','Mức tham gia BHTN']);
  // Gộp tất cả cột của các mảng user được phân quyền
  var areaCols = [];
  myAreas.forEach(function(a) {
    (AREA_COL_MAP[a] || []).forEach(function(c) { if (areaCols.indexOf(c) < 0) areaCols.push(c); });
  });
  areaCols = areaCols.concat(['Mức lương thỏa thuận','Mức tham gia BHXH','Mức tham gia BHTN']);
  var requiredCols = ['Mã NV','Họ và tên'];
  var alwaysHighlight = ['Công ty đang làm việc hiện tại'];

  var wb = new ExcelJS.Workbook();
  var ws = wb.addWorksheet('Dữ liệu');

  ws.columns = allHeaders.map(function(h) {
    return { width: Math.max(h.length + 4, 14) };
  });

  var headerRow = ws.addRow(allHeaders.map(function(h) {
    if (requiredCols.indexOf(h) >= 0 || alwaysHighlight.indexOf(h) >= 0) return h + ' (*)';
    return h;
  }));
  headerRow.height = 36;

  headerRow.eachCell(function(cell, colNumber) {
    var h = allHeaders[colNumber - 1];
    var isArea = (alwaysHighlight.indexOf(h) >= 0) || (areaCols.indexOf(h) >= 0);
    cell.fill = {
      type: 'pattern', pattern: 'solid',
      fgColor: { argb: isArea ? 'FFFFD700' : 'FFF2F2F2' }
    };
    cell.font = {
      bold: true,
      color: { argb: isArea ? 'FF7B4F00' : 'FF999999' },
      size: 10
    };
    cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
    cell.border = {
      top:{style:'thin',color:{argb:'FFCCCCCC'}}, bottom:{style:'thin',color:{argb:'FFCCCCCC'}},
      left:{style:'thin',color:{argb:'FFCCCCCC'}}, right:{style:'thin',color:{argb:'FFCCCCCC'}}
    };
  });

  // 3 dòng trống mẫu
  for (var i = 0; i < 3; i++) {
    var rowData = allHeaders.map(function(h) {
      if (h === 'Công ty đang làm việc hiện tại') return myCongTys.length === 1 ? myCongTys[0] : '';
      return '';
    });
    ws.addRow(rowData);
  }

  // Sheet hướng dẫn
  var wsG = wb.addWorksheet('Hướng dẫn');
  wsG.columns = [{ width: 100 }];
  var guideLines = [
    'HƯỚNG DẪN SỬ DỤNG TEMPLATE — Mảng: ' + area,
    '',
    '• Template gồm 94 cột chuẩn của hệ thống HR + 3 cột lương/BHXH/BHTN',
    '• Cột BÔI VÀNG = cột bạn cần nhập liệu cho mảng "' + area + '"',
    '• Cột màu xám = không cần nhập (do bộ phận khác phụ trách)',
    '• Cột có dấu (*) = bắt buộc phải điền',
    '• Cột "Công ty đang làm việc hiện tại": điền đúng tên công ty bạn phụ trách',
    '',
    'Các cột cần nhập (' + areaCols.length + ' cột):',
    areaCols.join(', '),
    '',
    'Lưu file .xlsx rồi dùng nút "Import file Excel" để nộp dữ liệu',
  ];
  guideLines.forEach(function(line, idx) {
    var r = wsG.addRow([line]);
    if (idx === 0) { r.getCell(1).font = { bold:true, size:13, color:{argb:'FFCC0000'} }; }
  });

  wb.xlsx.writeBuffer().then(function(buffer) {
    var blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

    // Dùng claude.use("downloads") nếu trong artifact iframe
    if (window.claude && window.claude.use) {
      window.claude.use('downloads').then(function(downloads) {
        if (downloads) {
          downloads.save({ filename: fname, data: blob }).then(function() {
            showToast('Đã tải template: ' + fname, 'success');
          }).catch(function() {
            _fallbackDownload(blob, fname);
          });
        } else {
          _fallbackDownload(blob, fname);
        }
      }).catch(function() {
        _fallbackDownload(blob, fname);
      });
    } else {
      _fallbackDownload(blob, fname);
    }
  }).catch(function(err) {
    showToast('Lỗi tạo file: ' + (err&&err.message||err), 'error');
  });
}

function _fallbackDownload(blob, fname) {
  try {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = fname; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    showToast('Đã tải template: ' + fname, 'success');
  } catch(e) {
    try {
      var reader = new FileReader();
      reader.onload = function() {
        var a2 = document.createElement('a');
        a2.href = reader.result;
        a2.download = fname; a2.style.display='none';
        document.body.appendChild(a2); a2.click();
        setTimeout(function(){ document.body.removeChild(a2); }, 1000);
        showToast('Đã tải template: ' + fname, 'success');
      };
      reader.readAsDataURL(blob);
    } catch(e2) {
      showToast('Không tải được file. Hãy mở app bằng link riêng.', 'error');
    }
  }
}

// ── Import file Excel ──
function importExcel(input) {
  var file = input.files[0];
  if (!file) return;
  input.value = '';

  var statusEl = document.getElementById('import_status');
  statusEl.style.display = 'block';
  statusEl.innerHTML = '<div style="background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;padding:12px;font-size:13px;color:#1D4ED8">⏳ Đang đọc file <b>'+esc(file.name)+'</b>...</div>';

  if (typeof XLSX === 'undefined') {
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = function(){ doImportExcel(file, statusEl); };
    document.head.appendChild(s);
    return;
  }
  doImportExcel(file, statusEl);
}

function doImportExcel(file, statusEl) {
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var wb = XLSX.read(e.target.result, { type: 'binary', cellDates: true });
      var ws = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

      if (!rows.length) {
        statusEl.innerHTML = '<div style="background:#FEE2E2;border:1px solid #FECACA;border-radius:8px;padding:12px;font-size:13px;color:#991B1B">❌ File không có dữ liệu (từ dòng 2 trở đi)</div>';
        return;
      }

      var pc = document.getElementById('pageContent');
      var area = pc ? pc.dataset.curArea : getMyAreas()[0];
      var memberSheet = 'Data';
      var myCongTys = getMyCongTys();

      // Normalize header keys: bỏ (*), khoảng trắng thừa
      var firstRow = rows[0];
      var normalizedKeys = Object.keys(firstRow).map(function(k){ return k.replace(/\s*\(\*\)\s*/g,'').trim(); });
      rows = rows.map(function(r) {
        var newR = {};
        Object.keys(r).forEach(function(k) {
          var nk = k.replace(/\s*\(\*\)\s*/g,'').trim();
          newR[nk] = r[k];
        });
        return newR;
      });
      firstRow = rows[0];
      var hasBasicCols = ('Mã NV' in firstRow) || ('Họ và tên' in firstRow) || ('maNV' in firstRow) || ('hoTen' in firstRow);
      if (!hasBasicCols) {
        statusEl.innerHTML = '<div style="background:#FEF3C7;border:1px solid #FCD34D;border-radius:8px;padding:12px;font-size:13px">'+
          '⚠️ File thiếu cột cơ bản (Mã NV hoặc Họ và tên). Vui lòng dùng template đã tải.</div>';
        return;
      }

      // Kiểm tra công ty hợp lệ
      var invalidCongTy = [];
      rows.forEach(function(r, i) {
        var ct = String(r['Công ty']||'').trim();
        if (myCongTys.length && ct && myCongTys.indexOf(ct) < 0) {
          invalidCongTy.push('Dòng '+(i+2)+': "'+ct+'" không trong danh sách được phép');
        }
      });
      if (invalidCongTy.length) {
        statusEl.innerHTML = '<div style="background:#FEE2E2;border:1px solid #FECACA;border-radius:8px;padding:12px;font-size:13px;color:#991B1B">'+
          '❌ Có công ty không hợp lệ:<br>'+invalidCongTy.slice(0,5).map(function(s){ return '• '+esc(s); }).join('<br>')+
          (invalidCongTy.length>5?'<br>... và '+(invalidCongTy.length-5)+' dòng khác':'')+
          '</div>';
        return;
      }

      // Hiện preview trước khi gửi
      showImportPreview(rows, area, memberSheet, statusEl);

    } catch(err) {
      statusEl.innerHTML = '<div style="background:#FEE2E2;border:1px solid #FECACA;border-radius:8px;padding:12px;font-size:13px;color:#991B1B">❌ Lỗi đọc file: '+esc(String(err))+'</div>';
    }
  };
  reader.readAsBinaryString(file);
}

function showImportPreview(rows, area, memberSheet, statusEl) {
  var fields = AREA_FIELDS[area] || [];
  var previewCols = fields.slice(0, 5).map(function(f){ return f.key; });
  var totalRows = rows.length;

  var tableHtml = '<table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:8px">'+
    '<thead><tr style="background:#F3F4F6">'+
    ['#'].concat(previewCols).map(function(c){ return '<th style="padding:5px 8px;text-align:left;border:1px solid #E5E7EB">'+esc(c)+'</th>'; }).join('')+
    (fields.length>5?'<th style="padding:5px 8px;border:1px solid #E5E7EB;color:var(--gray)">...</th>':'')+
    '</tr></thead><tbody>'+
    rows.slice(0,5).map(function(r, i){
      return '<tr>'+
        ['<td style="padding:5px 8px;border:1px solid #E5E7EB;color:var(--gray)">'+(i+1)+'</td>'].concat(
          previewCols.map(function(k){
            var v = r[k]; if(v instanceof Date) v = v.toLocaleDateString('vi-VN');
            return '<td style="padding:5px 8px;border:1px solid #E5E7EB">'+esc(String(v||''))+'</td>';
          })
        ).join('')+
        (fields.length>5?'<td style="padding:5px 8px;border:1px solid #E5E7EB;color:var(--gray)">...</td>':'')+
      '</tr>';
    }).join('')+
    '</tbody></table>'+
    (totalRows>5?'<div style="font-size:11px;color:var(--gray);margin-top:4px">... và '+(totalRows-5)+' dòng nữa</div>':'');

  statusEl.innerHTML =
    '<div style="background:#F0FDF4;border:1px solid #BBF7D0;border-radius:10px;padding:14px">'+
    '<div style="font-weight:600;font-size:13px;color:#065F46;margin-bottom:6px">✅ Đọc file thành công — <b>'+totalRows+'</b> dòng dữ liệu</div>'+
    '<div style="font-size:12px;color:#374151;margin-bottom:8px">Xem trước (5 dòng đầu):</div>'+
    tableHtml+
    '<div style="display:flex;gap:10px;margin-top:14px">'+
      '<button class="btn btn-primary" style="font-size:13px" onclick="submitImportRows(importPendingRows)">📤 Gửi '+totalRows+' dòng lên Google Sheets</button>'+
      '<button class="btn btn-secondary" style="font-size:13px" onclick="document.getElementById(\'import_status\').style.display=\'none\'">Hủy</button>'+
    '</div>'+
    '</div>';

  // Lưu rows vào biến tạm
  window.importPendingRows = { rows: rows, area: area, sheet: memberSheet };
}

function submitImportRows(pending) {
  if (!pending || !pending.rows) return;
  var rows = pending.rows;
  var memberSheet = pending.sheet;
  var statusEl = document.getElementById('import_status');

  statusEl.innerHTML = '<div style="background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;padding:12px;font-size:13px;color:#1D4ED8">'+
    '⏳ Đang gửi <b>'+rows.length+'</b> dòng lên Google Sheets...</div>';

  // Chuẩn bị tất cả rows
  var allData = rows.map(function(r) {
    var data = {};
    Object.keys(r).forEach(function(k){
      var v = r[k];
      if (v instanceof Date) v = v.toLocaleDateString('vi-VN');
      data[k] = String(v||'').trim();
    });
    if (data['Công ty'] && !data['Công ty đang làm việc hiện tại']) {
      data['Công ty đang làm việc hiện tại'] = data['Công ty'];
    }
    return data;
  });

  // Gửi 1 request batch thay vì từng dòng
  fetch(GAS_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'batchAddRows', sheet: memberSheet, rows: allData })
  }).then(function(r){ return r.json(); })
  .then(function(resp){
    var inserted = resp.inserted || allData.length;
    var failed = resp.failed || 0;
    if (resp.ok) {
      allData.forEach(function(data){
        addHistory({ time: new Date().toISOString(), area: pending.area, congTy: data['Công ty']||'', maNV: data['Mã NV']||'', hoTen: data['Họ và tên']||'', user: CU.username, status:'ok' });
      });
    }
    var msg = '✅ Đã gửi <b>'+inserted+'</b>/'+allData.length+' dòng thành công';
    if (failed) msg += ' · <span style="color:#EF4444">'+failed+' lỗi</span>';
    statusEl.innerHTML = '<div style="background:'+(failed?'#FEF3C7':'#F0FDF4')+';border:1px solid '+(failed?'#FCD34D':'#BBF7D0')+';border-radius:8px;padding:12px;font-size:13px">'+msg+'</div>';
    window.importPendingRows = null;
  }).catch(function(){
    allData.forEach(function(data){
      addHistory({ time: new Date().toISOString(), area: pending.area, congTy: data['Công ty']||'', maNV: data['Mã NV']||'', hoTen: data['Họ và tên']||'', user: CU.username, status:'pending', data: data, sheet: memberSheet });
    });
    statusEl.innerHTML = '<div style="background:#FEF3C7;border:1px solid #FCD34D;border-radius:8px;padding:12px;font-size:13px">⚠️ Lỗi mạng — đã lưu tạm, sẽ gửi lại sau.</div>';
    window.importPendingRows = null;
  });
}

function renderDeFields(area) {
  var fields = AREA_FIELDS[area] || [];
  if (!fields.length) return '<p style="color:var(--gray);font-size:13px">Không có trường nào cho mảng này.</p>';
  var pairs = [];
  for (var i = 0; i < fields.length; i += 2) {
    pairs.push(fields.slice(i, i+2));
  }
  return pairs.map(function(pair){
    return '<div class="form-row '+(pair.length===2?'col2':'')+'">'+
      pair.map(function(f){
        return '<div class="fg">'+
          '<label style="font-size:13px;font-weight:600;color:var(--dark2)">'+(f.required?'<span style="color:#EF4444">*</span> ':'')+f.label+'</label>'+
          renderDeField(f)+
        '</div>';
      }).join('')+
    '</div>';
  }).join('');
}

function renderDeField(f) {
  var base = 'style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-top:5px;box-sizing:border-box"';
  var id = 'de_' + f.key.replace(/[^a-zA-Z0-9]/g,'_');
  if (f.type === 'select') {
    return '<select id="'+id+'" '+base+'>'+
      '<option value="">-- Chọn --</option>'+
      (f.opts||[]).map(function(o){ return '<option>'+esc(o)+'</option>'; }).join('')+
    '</select>';
  }
  if (f.type === 'textarea') {
    return '<textarea id="'+id+'" rows="3" '+base.replace('style="','style="resize:vertical;')+'></textarea>';
  }
  return '<input id="'+id+'" type="'+(f.type||'text')+'" '+base+'>';
}

function switchDeArea(btn, area) {
  document.querySelectorAll('.de-area-tab').forEach(function(b){
    b.className = b === btn ? 'btn btn-primary de-area-tab' : 'btn btn-secondary de-area-tab';
  });
  document.getElementById('de_fields').innerHTML = renderDeFields(area);
  document.getElementById('pageContent').dataset.curArea = area;
}

function clearDeForm() {
  var pc = document.getElementById('pageContent');
  var area = pc ? pc.dataset.curArea : '';
  var fields = area ? (AREA_FIELDS[area] || []) : [];
  fields.forEach(function(f){
    var id = 'de_' + f.key.replace(/[^a-zA-Z0-9]/g,'_');
    var el = document.getElementById(id);
    if (el) el.value = '';
  });
  var congTy = document.getElementById('de_congTy');
  if (congTy) congTy.value = '';
  showToast('Đã xóa form','info');
}

function submitDataEntry() {
  var pc = document.getElementById('pageContent');
  var area = pc ? pc.dataset.curArea : '';
  var fields = AREA_FIELDS[area] || [];
  var congTyEl = document.getElementById('de_congTy');
  var congTy = congTyEl ? congTyEl.value.trim() : '';

  // Validate
  if (congTyEl && !congTy) { showToast('Vui lòng chọn công ty','error'); congTyEl.focus(); return; }

  var data = {};
  var valid = true;
  if (congTy) data['Công ty đang làm việc hiện tại'] = congTy;

  fields.forEach(function(f){
    var id = 'de_' + f.key.replace(/[^a-zA-Z0-9]/g,'_');
    var el = document.getElementById(id);
    var val = el ? el.value.trim() : '';
    if (f.required && !val) {
      showToast('Vui lòng điền: '+f.label,'error');
      if (el) el.focus();
      valid = false;
    }
    data[f.key] = val;
  });
  if (!valid) return;

  var memberSheet = 'Data';

  var payload = {
    action: 'addRow',
    sheet: memberSheet,
    data: data
  };

  // Hiện loading
  var statusEl = document.getElementById('de_status');
  statusEl.style.display = 'block';
  statusEl.innerHTML = '<div style="color:var(--primary);font-size:13px">⏳ Đang gửi dữ liệu lên Google Sheets...</div>';

  fetch(GAS_URL, {
    method: 'POST',
    body: JSON.stringify(payload)
  })
  .then(function(r){ return r.json(); })
  .then(function(resp) {
    if (resp.status === 'ok' || resp.ok === true) {
      statusEl.innerHTML = '<div style="color:#10B981;font-size:13px;font-weight:600">✅ Đã gửi thành công!</div>';
      addHistory({ time: new Date().toISOString(), area: area, congTy: congTy, maNV: data['Mã NV']||'', hoTen: data['Họ và tên']||'', user: CU.username, status:'ok' });
      setTimeout(function(){ clearDeForm(); statusEl.style.display='none'; }, 2000);
    } else {
      statusEl.innerHTML = '<div style="color:#EF4444;font-size:13px">❌ Lỗi: '+(resp.message||'Không xác định')+'</div>';
    }
  })
  .catch(function(err) {
    // Fallback: lưu tạm vào localStorage để sync sau
    addHistory({ time: new Date().toISOString(), area: area, congTy: congTy, maNV: data['Mã NV']||'', hoTen: data['Họ và tên']||'', user: CU.username, status:'pending', data: data, sheet: memberSheet });
    statusEl.innerHTML =
      '<div style="background:#FEF3C7;border:1px solid #FCD34D;border-radius:8px;padding:12px;font-size:13px">'+
      '⚠️ <strong>Chưa gửi được lên Google Sheets</strong> (có thể do mạng hoặc CSP).<br>'+
      'Dữ liệu đã được <strong>lưu tạm trên máy</strong> và sẽ đồng bộ khi có kết nối.<br>'+
      '<button class="btn btn-secondary btn-sm" onclick="retryPendingSubmits()" style="margin-top:8px">🔄 Thử gửi lại</button>'+
      '</div>';
  });
}

function retryPendingSubmits() {
  var h = getHistory();
  var pending = h.filter(function(r){ return r.status === 'pending'; });
  if (!pending.length) { showToast('Không có dữ liệu chờ gửi','info'); return; }
  var sent = 0;
  var done = 0;
  pending.forEach(function(rec) {
    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action:'addRow', sheet: rec.sheet, data: rec.data })
    }).then(function(r){ return r.json(); })
    .then(function(resp) {
      done++;
      if (resp.status === 'ok' || resp.ok === true) {
        sent++;
        // Update status trong lịch sử
        var idx = h.indexOf(rec);
        if (idx>=0) h[idx].status = 'ok';
      }
      if (done === pending.length) {
        lsSave(LS_HISTORY_KEY, h);
        showToast('Đã gửi lại '+sent+'/'+pending.length+' bản ghi','success');
      }
    }).catch(function(){
      done++;
      if (done === pending.length && sent > 0) {
        lsSave(LS_HISTORY_KEY, h);
        showToast('Gửi được '+sent+'/'+pending.length+' bản ghi','info');
      }
    });
  });
}

function renderSubmitHistory() {
  document.getElementById('pageTitle').textContent = 'Lịch sử nộp';
  curModule = 'history';
  document.querySelectorAll('.nav-item').forEach(function(el){ el.classList.remove('active'); });
  var nav = document.getElementById('nav_history');
  if (nav) nav.classList.add('active');

  var h = getHistory().filter(function(r){ return r.user === CU.username; });
  if (!h.length) {
    document.getElementById('pageContent').innerHTML =
      '<div style="padding:40px;text-align:center;color:var(--gray)">'+
      '<div style="font-size:36px;margin-bottom:10px">📭</div>'+
      '<div>Chưa có dữ liệu nào được gửi</div></div>';
    return;
  }

  var html = '<div style="max-width:800px;margin:0 auto;padding:24px 16px">'+
    '<div style="background:var(--white);border-radius:16px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.08)">'+
    '<h2 style="font-size:16px;font-weight:700;margin:0 0 16px">📋 Lịch sử gửi dữ liệu ('+h.length+' bản ghi)</h2>'+
    '<table style="width:100%;border-collapse:collapse;font-size:13px">'+
    '<thead><tr style="background:#F3F4F6">'+
      '<th style="padding:8px;text-align:left;border-bottom:2px solid var(--border)">Thời gian</th>'+
      '<th style="padding:8px;text-align:left;border-bottom:2px solid var(--border)">Mảng</th>'+
      '<th style="padding:8px;text-align:left;border-bottom:2px solid var(--border)">Mã NV</th>'+
      '<th style="padding:8px;text-align:left;border-bottom:2px solid var(--border)">Họ tên</th>'+
      '<th style="padding:8px;text-align:left;border-bottom:2px solid var(--border)">Công ty</th>'+
      '<th style="padding:8px;text-align:center;border-bottom:2px solid var(--border)">Trạng thái</th>'+
    '</tr></thead><tbody>'+
    h.map(function(r){
      var d = new Date(r.time);
      var timeStr = d.toLocaleDateString('vi-VN')+' '+d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
      var badge = r.status==='ok'
        ? '<span style="background:#D1FAE5;color:#065F46;padding:2px 8px;border-radius:12px;font-size:11px">✅ Đã gửi</span>'
        : '<span style="background:#FEF3C7;color:#92400E;padding:2px 8px;border-radius:12px;font-size:11px">⏳ Chờ gửi</span>';
      return '<tr style="border-bottom:1px solid var(--border)">'+
        '<td style="padding:8px;color:#6B7280">'+timeStr+'</td>'+
        '<td style="padding:8px">'+esc(r.area||'')+'</td>'+
        '<td style="padding:8px;font-family:monospace">'+esc(r.maNV||'')+'</td>'+
        '<td style="padding:8px">'+esc(r.hoTen||'')+'</td>'+
        '<td style="padding:8px">'+esc(r.congTy||'')+'</td>'+
        '<td style="padding:8px;text-align:center">'+badge+'</td>'+
      '</tr>';
    }).join('')+
    '</tbody></table>'+
    (h.some(function(r){ return r.status==='pending'; }) ?
      '<div style="margin-top:14px"><button class="btn btn-primary" onclick="retryPendingSubmits()">🔄 Gửi lại bản ghi chờ</button></div>' : '')+
    '</div></div>';

  document.getElementById('pageContent').innerHTML = html;
}
</script>
